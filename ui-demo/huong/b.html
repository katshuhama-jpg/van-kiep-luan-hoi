<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hướng B - Ngự kiếm phi hành</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Protest+Revolution&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.app{background:#1a1430}
.bg{position:absolute;left:50%;top:0;width:432px;height:768px;transform:translateX(-50%)}
.top{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-to-bottom;}
.av{width:46px;height:46px;border-radius:50%;overflow:hidden;background:#3a2c5a;box-shadow:0 0 0 2px #ffcf6e}
.av img{width:52px;height:100px;margin:-2px 0 0 -3px}
.lc{font-family:'Protest Revolution';font-size:26px;color:#ffcf6e;text-shadow:2px 2px 0 #3a1a10;line-height:1}
.nm{color:#e8dcff;font-size:13px;font-weight:700}
.gold{margin-left:auto;display:flex;align-items:center;gap:4px;color:#fff;font-weight:700;padding:3px 8px;background:rgba(10,8,20,.6);box-shadow:0 0 0 1px #6a5a9a}
.stage{position:absolute;left:50%;top:66px;transform:translateX(-50%);z-index:5;color:#e8dcff;font-weight:700;font-size:14px;padding:2px 12px;background:rgba(10,8,20,.6);white-space:nowrap}
.m{position:absolute;z-index:3;animation:desc 6s linear infinite}
.me{position:absolute;left:50%;bottom:226px;margin-left:-52px;z-index:4}
.me .s{width:104px;height:94px;background-image:url(ct_back.png);background-size:200% 100%;animation:play 1s steps(1) infinite}
.cloud{position:absolute;left:50%;bottom:204px;width:186px;height:60px;margin-left:-93px;z-index:3;background:url(cloud.png) 0 0/100% 100%;image-rendering:pixelated;animation:bob 2s steps(2) infinite}
.k{position:absolute;left:50%;bottom:310px;width:14px;height:52px;z-index:4;background:url(phikiem_ice.png) 0 0/100% 100%;transform-origin:center;--dx:0;--dy:-330px;animation:up .7s linear infinite}
.k::before{content:"";position:absolute;left:0;top:0;width:52px;height:14px;transform:rotate(-90deg) translate(-19px,-19px);background:url(phikiem_ice.png) 0 0/100% 100%}
.k{background:none}
.bot{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:0 12px 10px}
.skills{display:flex;align-items:flex-end;justify-content:center;gap:18px;margin-bottom:10px}
.sk{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,#4a3a6a,#1a1430);display:flex;align-items:center;justify-content:center;color:#e8dcff;font-size:11px;font-weight:700;text-align:center;box-shadow:0 0 0 2px #ffcf6e}
.sk.big{width:76px;height:76px;font-size:14px;color:#1f160d;background:#ffcf6e;box-shadow:0 0 0 3px #fff8e6,0 0 18px #ffcf6e}
.quest{display:flex;align-items:center;gap:8px;padding:6px 10px;margin-bottom:8px;background:rgba(10,8,20,.7);color:#e8dcff;font-size:13px;font-weight:700;box-shadow:0 0 0 1px #6a5a9a}
.quest b{color:#ffcf6e}
.nav{display:grid;grid-template-columns:repeat(5,1fr);color:#c8b8e8;font-size:12px;font-weight:700;text-align:center;padding:8px 0;background:rgba(10,8,20,.85);box-shadow:0 0 0 1px #6a5a9a}
.nav b.on{color:#ffcf6e}
.lbl{position:absolute;right:8px;top:96px;z-index:9;background:#1f160d;color:#ffcf6e;padding:3px 8px;font-weight:700;font-size:13px}
</style></head><body><div class="app">
<img class="bg" src="bg_loi-dinh.png" alt="">
<div class="top"><div class="av"><img src="../img/st_front.png" alt=""></div><div><div class="nm">Lâm Thanh Vân · Ngộ Đạo 2</div><div class="lc">24.900</div></div><div class="gold"><img src="linhthach.png" alt="" style="width:16px;height:16px">1.260</div></div>
<div class="stage">Ải 3-14 · Lôi Đình Hải · 5/12</div>
<div class="m strip" style="left:14%;top:150px;width:62px;height:60px;background-image:url(m_bat.png);background-size:700% 100%;animation:play .6s steps(6,jump-none) infinite,desc 6s linear infinite"></div>
<div class="m strip" style="left:62%;top:120px;width:62px;height:60px;background-image:url(m_bat.png);background-size:700% 100%;animation:play .6s steps(6,jump-none) infinite,desc 6s linear infinite;animation-delay:0s,-2s"></div>
<div class="m strip" style="left:36%;top:170px;width:80px;height:110px;background-image:url(m_ghost.png);background-size:600% 100%;animation:play 1.2s steps(2,jump-none) infinite,desc 6s linear infinite;animation-delay:0s,-1s"></div>
<div class="m strip" style="left:70%;top:220px;width:64px;height:102px;background-image:url(m_eye.png);background-size:700% 100%;animation:play 1s steps(3,jump-none) infinite,desc 6s linear infinite;animation-delay:0s,-4s"></div>
<span class="num" style="left:44%;top:260px">2.148</span><span class="num c" style="left:22%;top:230px;animation-delay:.7s">4.875!</span><span class="num" style="left:66%;top:300px;animation-delay:1.1s">1.902</span>
<div class="k" style="margin-left:-30px"></div><div class="k" style="animation-delay:.35s"></div><div class="k" style="margin-left:30px;animation-delay:.18s"></div>
<div class="cloud"></div>
<div class="me"><div class="s strip"></div></div>
<div class="bot">
  <div class="skills"><div class="sk">Tự<br>động</div><div class="sk big">Vạn<br>Kiếm</div><div class="sk">Túi<br>đồ</div></div>
  <div class="quest">Nhiệm vụ: <b>Trả thù kiếp 5</b> · hạ Kim Sí Đại Bằng ở ải 3-15</div>
  <div class="nav"><b>Nhân vật</b><b>Pháp khí</b><b class="on">Phi hành</b><b>Công pháp</b><b>Động phủ</b></div>
</div>
<span class="lbl">Hướng B · Ngự kiếm phi hành</span>
</div></body></html>
